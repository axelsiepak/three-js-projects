<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Three.js Projects</title>
		<link rel="icon" type="image/svg+xml" href="/favicon.svg">
		<style>
			body {
				display: flex;
				flex-direction: column;
				box-sizing: border-box;
				min-height: 100vh;
				margin: 0 auto;
				max-width: 56rem;
				padding: 3rem 1rem 1.5rem;
				background: #101014;
				color: #f4f4f5;
				font-family: system-ui, sans-serif;
			}

			h1 {
				margin: 0 0 1.5rem;
				font-size: 1.75rem;
			}

			ul {
				display: grid;
				grid-template-columns: repeat(auto-fill, minmax(min(100%, 20rem), 1fr));
				gap: 1rem;
				margin: 0;
				padding: 0;
				list-style: none;
			}

			li a {
				display: block;
				position: relative;
				overflow: hidden;
				aspect-ratio: 16 / 10;
				border: 1px solid #3f3f46;
				border-radius: 0.5rem;
				background: #050508;
				color: inherit;
				text-decoration: none;
			}

			img {
				display: block;
				width: 100%;
				height: 100%;
				object-fit: cover;
			}

			span {
				position: absolute;
				inset: auto 0 0;
				padding: 2rem 1.25rem 1rem;
				background: linear-gradient(transparent, rgb(0 0 0 / 0.8));
				font-weight: 600;
			}

			li a:hover,
			li a:focus-visible {
				border-color: #8b5cf6;
			}

			footer {
				margin-top: auto;
				padding-top: 3rem;
				color: #a1a1aa;
				font-size: 0.875rem;
				text-align: center;
			}

			footer a {
				color: #f4f4f5;
			}
		</style>
	</head>
	<body>
		<h1>Three.js Projects</h1>
		<ul>
			<!-- projects -->
		</ul>
		<footer>
			Built with <a href="https://threejs.org/">Three.js</a> · <a href="https://github.com/axelsiepak/three-js-projects">Source on GitHub</a>
		</footer>
	</body>
</html>
